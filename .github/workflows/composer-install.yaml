name: Composer Installation

on:
  workflow_call:
    inputs:
      mauticVersion:
        required: true
        type: string
        description: "The Mautic version"
      phpVersion:
        required: true
        type: string
        description: "The PHP Version"
      runner:
        required: false
        default: 'ubuntu-latest'
        type: string
        description: 'The GitHub runner to be used'
      pluginDir:
        required: true
        type: string
        description: "Plugin installation directory"
      additionalRequirements:
        required: false
        default: ''
        type: string
        description: 'Additional composer requirements'
      additionalRepositories:
        required: false
        default: ''
        type: string
        description: 'Additional composer repositories as a JSON array, e.g. [{"type":"vcs","url":"https://github.com/org/repo"}]'
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: false
        description: 'The GitHub Personal Access Token'
    outputs:
      composer-cache-key:
        description: "The composer cache key"
        value: ${{ jobs.composer-install.outputs.composer-cache-key }}
      composer-cache-dir:
        description: "The composer cache dir"
        value: ${{ jobs.composer-install.outputs.composer-cache-dir }}

jobs:
  composer-install:
    name: Composer install
    runs-on: ubuntu-latest
    outputs:
      # Map the job outputs to step outputs
      composer-cache-key: ${{ steps.generate-composer-cache-key.outputs.composer-cache-key }}
      composer-cache-dir: ${{ steps.generate-composer-cache-dir.outputs.composer-cache-dir }}
    steps:
      - name: Checkout Mautic
        uses: actions/checkout@v6
        with:
          repository: mautic/mautic
          ref: ${{ inputs.mauticVersion }}

      - name: Checkout this plugin
        uses: actions/checkout@v6
        with:
          path: ${{ inputs.pluginDir }}

      - name: Checkout required ci files
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: Leuchtfeuer/mautic-ci-runner
          sparse-checkout: ciFiles
          path: ciFiles

      - name: Creates cache key depending on the composer files
        id: generate-composer-cache-key
        env:
          ADDITIONAL_REQUIREMENTS: ${{ inputs.additionalRequirements }}
          ADDITIONAL_REPOSITORIES: ${{ inputs.additionalRepositories }}
        run: |
          requirements_hash=$(printf '%s%s' "$ADDITIONAL_REQUIREMENTS" "$ADDITIONAL_REPOSITORIES" | sha256sum | cut -d' ' -f1)
          echo "composer-cache-key=composer-v4-${{ hashFiles('composer.lock', format('{0}/composer.json', inputs.pluginDir)) }}-${requirements_hash}-${{ inputs.phpVersion }}-mautic${{ inputs.mauticVersion }}" >> "$GITHUB_OUTPUT"

      - name: Get Composer Cache Directory
        id: generate-composer-cache-dir
        run: echo "composer-cache-dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Cache
        uses: actions/cache/restore@v4
        id: cache-restore-composer
        with:
          path: |
            bin
            vendor
            plugins/*
            !${{ inputs.pluginDir }}
            app/bundles/CoreBundle/Assets/pictograms
          key: ${{ steps.generate-composer-cache-key.outputs.composer-cache-key }}

      - name: Setup PHP, with composer and extensions
        if: steps.cache-restore-composer.outputs.cache-hit != 'true'
        uses: shivammathur/setup-php@v2
        with:
          # The PAT lets Composer read private repositories from additionalRepositories
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          php-version: ${{ inputs.phpVersion }}
          ini-values: -dpcov.enabled=0, pcov.directory=."
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql
          coverage: pcov

      - name: Install Composer dependencies
        if: steps.cache-restore-composer.outputs.cache-hit != 'true' && inputs.additionalRequirements == ''
        run: composer install

      #- name: Install additional dependencies
      #  if: steps.cache-restore-composer.outputs.cache-hit != 'true'
       # run: composer require "phpstan/phpstan-strict-rules" --no-interaction

      # Composer scripts boot Mautic with the tested plugin, so its dependencies must be installed first
      - name: Install Composer dependencies with plugin dependencies
        if: steps.cache-restore-composer.outputs.cache-hit != 'true' && inputs.additionalRequirements != ''
        env:
          ADDITIONAL_REPOSITORIES: ${{ inputs.additionalRepositories }}
        run: |
          composer install --no-interaction --no-scripts
          if [ -n "$ADDITIONAL_REPOSITORIES" ]; then
            jq -c 'to_entries[]' <<< "$ADDITIONAL_REPOSITORIES" | while read -r entry; do
              composer config --no-interaction "repositories.additional-$(jq -r '.key' <<< "$entry")" "$(jq -c '.value' <<< "$entry")"
            done
          fi
          composer require ${{ inputs.additionalRequirements }} --no-interaction

      - name: Create composer cache
        if: steps.cache-restore-composer.outputs.cache-hit != 'true'
        id: cache-save-composer
        uses: actions/cache/save@v6
        with:
          path: |
            bin
            vendor
            plugins/*
            !${{ inputs.pluginDir }}
            app/bundles/CoreBundle/Assets/pictograms
          key: ${{ steps.generate-composer-cache-key.outputs.composer-cache-key }}
