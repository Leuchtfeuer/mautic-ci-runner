name: Mautic Plugin tests

on:
  workflow_call:
    inputs:
      mauticVersion:
        required: true
        type: string
        description: "Mautic Version"
      phpVersion:
        required: true
        type: string
        description: "PHP Version"
      runner:
        required: false
        default: 'ubuntu-latest'
        type: string
        description: 'The GitHub runner to be used'
      pluginDir:
        required: true
        type: string
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: false
        description: 'The GitHub Personal Access Token'

jobs:
  determine-reqs:
    name: Run Custom Tests
    runs-on: ubuntu-latest
    steps:
      - name: Copy required files
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: Leuchtfeuer/mautic-ci-runner
          sparse-checkout: .github/custom_tests
          path: ciFiles

      - name: Run custom tests
        run: |
          find ciFiles/.github/custom_tests -type f -ipath 'ciFiles/.github/custom_tests/*.sh' -print0 | while IFS= read -r -d '' script; do
            bash "$script"
          done