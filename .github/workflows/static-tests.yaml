name: Static Tests

on:
  workflow_call:
    inputs:
      mauticVersion:
        required: true
        type: string
        description: "Mautic Version"
      phpVersion:
        required: true
        type: string
        description: "PHP Version"
      runner:
        required: false
        default: 'ubuntu-latest'
        type: string
        description: 'The GitHub runner to be used'
      pluginDir:
        required: true
        type: string
      additionalRequirements:
        required: false
        default: ''
        type: string
        description: 'Additional composer requirements'
      additionalRepositories:
        required: false
        default: ''
        type: string
        description: 'Additional composer repositories as a JSON array, e.g. [{"type":"vcs","url":"https://github.com/org/repo"}]'
      composerCacheKey:
        required: true
        type: string
        description: "Key for Composer Cache"
      skipRector:
        required: false
        type: boolean
        default: false
        description: "Should Rector be skipped?"
      skipCS:
        required: false
        type: boolean
        default: false
        description: "Should CSFixer be skipped?"
      skipPhpStan:
        required: false
        type: boolean
        default: false
        description: "Should PHPSTAN be skipped?"
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: false
        description: 'The GitHub Personal Access Token'

jobs:
  static-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Static Tests; PHP ${{ inputs.phpVersion }}, Mautic ${{ inputs.mauticVersion }}
    steps:
      - name: Checkout Mautic
        uses: actions/checkout@v6
        with:
          repository: mautic/mautic
          ref: ${{ inputs.mauticVersion }}

      - name: Checkout this plugin
        uses: actions/checkout@v6
        with:
          path: ${{ inputs.pluginDir }}

      - name: Checkout required ci files
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: Leuchtfeuer/mautic-ci-runner
          sparse-checkout: ciFiles
          path: ciFiles

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          # The PAT lets Composer read private repositories from additionalRepositories
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          php-version: ${{ inputs.phpVersion }}
          ini-values: -dpcov.enabled=0, pcov.directory=."
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql
          coverage: pcov

      - name: Restore Cache
        uses: actions/cache/restore@v6
        id: cache-restore-composer
        with:
          path: |
            bin
            vendor
            plugins/*
            !${{ inputs.pluginDir }}
            app/bundles/CoreBundle/Assets/pictograms
          key: ${{ inputs.composerCacheKey }}

      - name: Install Composer dependencies
        if: steps.cache-restore-composer.outputs.cache-hit != 'true' && inputs.additionalRequirements == ''
        run: composer install --no-interaction

      # Composer scripts boot Mautic with the tested plugin, so its dependencies must be installed first
      - name: Install Composer dependencies with plugin dependencies
        if: steps.cache-restore-composer.outputs.cache-hit != 'true' && inputs.additionalRequirements != ''
        env:
          ADDITIONAL_REPOSITORIES: ${{ inputs.additionalRepositories }}
        run: |
          composer install --no-interaction --no-scripts
          if [ -n "$ADDITIONAL_REPOSITORIES" ]; then
            jq -c 'to_entries[]' <<< "$ADDITIONAL_REPOSITORIES" | while read -r entry; do
              composer config --no-interaction "repositories.additional-$(jq -r '.key' <<< "$entry")" "$(jq -c '.value' <<< "$entry")"
            done
          fi
          composer require ${{ inputs.additionalRequirements }} --no-interaction

      - name: Run Code Style check
        if: ${{ inputs.skipCS != true }}
        run: bin/php-cs-fixer fix ${{ inputs.pluginDir }} --config=.php-cs-fixer.php -v --dry-run --show-progress=dots --diff

      - name: Copy phpstan.neon if needed
        run: |
          if [ -e ${{ inputs.pluginDir }}/phpstan.neon ]; then
            cp ${{ inputs.pluginDir }}/phpstan.neon .
            sed -i 's|vendor/mautic/core-lib|app|g' phpstan.neon
          else
            sed -i 's|#reportUnmatchedIgnoredErrors|reportUnmatchedIgnoredErrors|g' phpstan.neon
          fi

      - name: PHPSTAN
        if: ${{ inputs.skipPhpStan != true }}
        run: composer phpstan -- ${{ inputs.pluginDir }}

      - name: Rector
        if: ${{ inputs.skipRector != true }}
        run: composer rector -- --dry-run --no-progress-bar ${{ inputs.pluginDir }}

      - name: Twig Lint
        run: bin/console lint:twig ${{ inputs.pluginDir }}

      - name: Upload logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mautic-logs-php${{ inputs.phpVersion }}-mautic${{ inputs.mauticVersion }}
          path: var/logs/
